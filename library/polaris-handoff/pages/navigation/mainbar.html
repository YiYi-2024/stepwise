<script>
const emptyProjects = document.querySelector('#empty-project-list');
document.querySelectorAll('[data-project-list]').forEach(list => {
  if (list.childElementCount) return;
  list.append(emptyProjects.content.cloneNode(true));
  const section = list.previousElementSibling;
  if (section) section.classList.add('pl-project-empty__title');
});
</script>
<script>
const listAnimations = new WeakMap();

function toggleList(button, list) {
  const opening = button.getAttribute('aria-expanded') !== 'true';
  button.setAttribute('aria-expanded', String(opening));
  if (!list) return;

  const startHeight = list.getBoundingClientRect().height;
  listAnimations.get(list)?.cancel();
  list.inert = !opening;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    list.hidden = !opening;
    list.style.removeProperty('overflow');
    listAnimations.delete(list);
    return;
  }

  list.hidden = false;
  list.style.overflow = 'hidden';
  const animation = list.animate([
    { height: startHeight + 'px' },
    { height: (opening ? list.scrollHeight : 0) + 'px' }
  ], { duration: 160, easing: 'ease-in-out' });
  listAnimations.set(list, animation);
  animation.onfinish = () => {
    if (listAnimations.get(list) !== animation) return;
    list.hidden = !opening;
    list.style.removeProperty('overflow');
    listAnimations.delete(list);
  };
}

document.querySelectorAll('.pl-mainbar-item--project').forEach(button => {
  const list = button.closest('.pl-mainbar-group').querySelector('.pl-mainbar-group__children');
  if (list) button.addEventListener('click', () => toggleList(button, list));
});

document.querySelectorAll('.pl-mainbar-section__toggle').forEach(button => {
  button.addEventListener('click', () => {
    button.closest('.pl-mainbar-section').classList.remove('is-hover');
    toggleList(button, document.getElementById(button.getAttribute('aria-controls')));
  });
});

document.querySelectorAll('.pl-mainbar-group__more').forEach(button => {
  button.addEventListener('click', () => {
    button.closest('.pl-mainbar-group').querySelectorAll('[data-extra]').forEach(item => item.hidden = false);
    button.remove();
  });
});
</script>
<script>
document.querySelectorAll('.pl-icon-button--on-bg, .pl-mainbar-item__action--new-task').forEach(button => {
  const tip = button.querySelector('[role="tooltip"]');
  if (!tip || !tip.showPopover) return;
  tip.popover = 'manual';

  function positionTip() {
    const rect = button.getBoundingClientRect();
    tip.style.left = (rect.left + rect.width / 2) + 'px';
    const below = button.getAttribute('aria-label') === '搜索';
    tip.style.top = (below ? rect.bottom + 6 : rect.top - 6) + 'px';
    tip.style.transform = below ? 'translateX(-50%)' : '';
  }

  function updateTip() {
    if (button.matches(':hover, :focus-visible')) {
      positionTip();
      tip.showPopover();
    } else {
      tip.hidePopover();
    }
  }

  for (const event of ['pointerenter', 'pointerleave', 'focus', 'blur']) {
    button.addEventListener(event, updateTip);
  }
  function repositionOpenTip() {
    if (tip.matches(':popover-open')) positionTip();
  }
  window.addEventListener('scroll', repositionOpenTip, true);
  window.addEventListener('resize', repositionOpenTip);
});
</script>


<script>
const details = document.getElementById('chat-details');
const chatRows = document.querySelectorAll(
  '[id$="-chats"] > .pl-mainbar-item, #pinned-items > .pl-mainbar-item, ' +
  '.pl-mainbar-group__children > .pl-mainbar-item, [data-chat-examples] > .pl-mainbar-item, ' +
  '.pl-mainbar-conversations--project > .pl-mainbar-item'
);
let currentChat;
let hoverTimer;

function closeDetails() {
  clearTimeout(hoverTimer);
  currentChat?.removeAttribute('aria-describedby');
  currentChat = null;
  details.hidden = true;
}

function positionDetails() {
  if (!currentChat) return;
  const rect = currentChat.getBoundingClientRect();
  const centeredTop = rect.top + (rect.height - details.offsetHeight) / 2;
  details.style.left = rect.right + 'px';
  details.style.top = Math.max(4, Math.min(centeredTop, innerHeight - details.offsetHeight - 4)) + 'px';
}

function showDetails(row) {
  if (document.querySelector(".pl-mainbar-menu:popover-open")) return;
  closeDetails();
  currentChat = row;
  const title = row.querySelector('.pl-mainbar-item__name').textContent;
  const inProject = row.closest('.pl-mainbar-group__children, .pl-mainbar-conversations--project');
  const project = row.closest('.pl-mainbar-group')?.querySelector('.pl-mainbar-item--project .pl-mainbar-item__name')?.textContent || '项目名称';
  details.querySelector('.pl-chat-details__title').textContent = title;
  details.querySelector('[data-path]').textContent = row.dataset.path || ['~/Documents/Northstar', ...(inProject ? [project] : []), title].join('/');
  details.querySelector('[data-project-line]').hidden = !inProject;
  details.querySelector('[data-project]').textContent = project;
  details.querySelector('[data-updated]').textContent = '更新于 ' + (row.dataset.updated || '2026/11/04 20:30:00');
  details.hidden = false;
  positionDetails();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    details.getAnimations().forEach(animation => animation.cancel());
    details.animate([
      { opacity: 0, transform: 'translateX(-4px)' },
      { opacity: 1, transform: 'translateX(0)' }
    ], { duration: 160, easing: 'ease-out' });
  }
  row.setAttribute('aria-describedby', details.id);
}

chatRows.forEach(row => {
  row.addEventListener('click', event => {
    const nav = row.closest('nav');
    if (!nav || event.target.closest('.pl-mainbar-item__action')) return;
    nav.querySelector('[aria-current="page"]')?.removeAttribute('aria-current');
    row.setAttribute('aria-current', 'page');
  });
  row.addEventListener('pointerenter', () => {
    closeDetails();
    hoverTimer = setTimeout(() => showDetails(row), 500);
  });
  row.addEventListener('pointerleave', closeDetails);
  row.addEventListener('focus', () => { if (row.matches(':focus-visible')) showDetails(row); });
  row.addEventListener('blur', closeDetails);
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDetails(); });
document.addEventListener('scroll', closeDetails, true);
window.addEventListener('resize', positionDetails);
</script>
