<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Button 按钮</title>
  <link rel="stylesheet" href="../../polaris.css" />
  <link rel="stylesheet" href="../preview.css" />
</head>
<body>
  <main class="preview-page">
    <div class="preview-page__lead">
      <h1 class="preview-page__title">Button 按钮</h1>

      <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型一：普通按钮</h2>
        <p class="preview-section__description">用于触发操作，可根据操作层级选择品牌、主要、次要或幽灵样式。</p>
      </header>

      <div class="preview-panel preview-panel--normal">
        <div class="preview-block">
        <div class="preview-spec">
          <strong class="preview-spec__title">大号尺寸：36px</strong>
          <span class="preview-spec__note">icon 可省略/配置</span>
        </div>
    <div class="preview-matrix" style="--preview-cols: 3; --preview-label-width: 30px">
      <span></span>
      <span class="preview-matrix__head">默认</span>
      <span class="preview-matrix__head">Hover</span>
      <span class="preview-matrix__head">禁用</span>

      <span class="preview-matrix__label">品牌</span>
      <button class="pl-button pl-button--brand" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--brand is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--brand" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">主要</span>
      <button class="pl-button pl-button--primary" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--primary is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--primary" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">次要</span>
      <button class="pl-button pl-button--secondary" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--secondary is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--secondary" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">幽灵</span>
      <button class="pl-button pl-button--ghost" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--ghost is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--ghost" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
    </div>
        </div>

        <div class="preview-block">
        <div class="preview-spec">
          <strong class="preview-spec__title">小号尺寸：32px</strong>
          <span class="preview-spec__note">icon 可省略/配置</span>
        </div>
    <div class="preview-matrix" style="--preview-cols: 3; --preview-label-width: 30px">
      <span></span>
      <span class="preview-matrix__head">默认</span>
      <span class="preview-matrix__head">Hover</span>
      <span class="preview-matrix__head">禁用</span>

      <span class="preview-matrix__label">品牌</span>
      <button class="pl-button pl-button--brand pl-button--small" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--brand pl-button--small is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--brand pl-button--small" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">主要</span>
      <button class="pl-button pl-button--primary pl-button--small" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--primary pl-button--small is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--primary pl-button--small" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">次要</span>
      <button class="pl-button pl-button--secondary pl-button--small" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--secondary pl-button--small is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--secondary pl-button--small" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>

      <span class="preview-matrix__label">幽灵</span>
      <button class="pl-button pl-button--ghost pl-button--small" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--ghost pl-button--small is-hover" type="button">
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
      <button class="pl-button pl-button--ghost pl-button--small" type="button" disabled>
        <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
        创建新项目
      </button>
    </div>
        </div>
      </div>
      </section>
    </div>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型二：删除按钮</h2>
        <p class="preview-section__description">用于需要明确表达删除意图的操作。</p>
      </header>

      <div class="preview-panel preview-panel--compact preview-panel--danger">
        <div class="preview-matrix" style="--preview-cols: 2; --preview-label-width: 30px">
          <span></span>
          <span class="preview-matrix__head">默认</span>
          <span class="preview-matrix__head">Hover</span>

          <span class="preview-matrix__label">大</span>
          <button class="pl-button pl-button--danger" type="button">
            <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/delete.svg)"></span>
            确定删除
          </button>
          <button class="pl-button pl-button--danger is-hover" type="button">
            <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/delete.svg)"></span>
            确定删除
          </button>
        </div>
      </div>
    </section>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型三：图标按钮</h2>
        <p class="preview-section__description">用于关闭等紧凑操作，Hover 时显示操作提示。</p>
      </header>

      <div class="preview-panel preview-panel--compact preview-panel--icon">
        <div class="preview-matrix" style="--preview-cols: 3; --preview-column-width: 80px; --preview-label-width: 30px">
          <span></span>
          <span class="preview-matrix__head">小</span>
          <span class="preview-matrix__head">中</span>
          <span class="preview-matrix__head">大</span>

          <span class="preview-matrix__label">默认</span>
          <button class="pl-icon-button pl-icon-button--small" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>
          <button class="pl-icon-button" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>
          <button class="pl-icon-button pl-icon-button--large" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>

          <span class="preview-matrix__label preview-matrix__spaced-row">Hover</span>
          <button class="pl-icon-button pl-icon-button--small is-hover preview-matrix__spaced-row" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>
          <button class="pl-icon-button is-hover preview-matrix__spaced-row" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>
          <button class="pl-icon-button pl-icon-button--large is-hover preview-matrix__spaced-row" type="button" aria-label="关闭">
            <span class="pl-icon-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/close.svg)"></span>
            <span class="pl-tooltip pl-icon-button__tooltip" role="tooltip">提示</span>
          </button>
        </div>
      </div>
    </section>
    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型四：翻页按钮</h2>
      </header>
      <div class="preview-panel preview-panel--compact">
        <div class="preview-matrix" style="--preview-cols: 2; --preview-column-width: 80px">
          <span></span>
          <span class="preview-matrix__head">向左</span>
          <span class="preview-matrix__head">向右</span>
          <span class="preview-matrix__label">默认</span>
          <button type="button" class="pl-page-button" aria-label="上一页"></button>
          <button type="button" class="pl-page-button pl-page-button--next" aria-label="下一页"></button>
          <span class="preview-matrix__label">Hover</span>
          <button type="button" class="pl-page-button is-hover" aria-label="上一页"></button>
          <button type="button" class="pl-page-button pl-page-button--next is-hover" aria-label="下一页"></button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
