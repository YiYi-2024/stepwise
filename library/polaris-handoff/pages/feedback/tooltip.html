<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Tooltip 轻提示</title>
  <link rel="stylesheet" href="../../polaris.css" />
  <link rel="stylesheet" href="../preview.css" />
</head>
<body>
  <main class="preview-page">
    <h1 class="preview-page__title">Tooltip 轻提示</h1>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">轻提示</h2>
        <p class="preview-section__description">深色底、白色 13px 文字，内边距 6px 8px，圆角 6px。图标按钮 hover 时引用它显示提示。</p>
      </header>
      <div class="preview-panel preview-panel--normal">
        <div class="preview-tiles">
          <div class="preview-tile">
            <span class="preview-tile__label">轻提示</span>
            <span class="pl-tooltip" role="tooltip">通过对话修改</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
