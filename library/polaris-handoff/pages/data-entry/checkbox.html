<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Checkbox 多选框</title>
  <link rel="stylesheet" href="../../polaris.css" />
  <link rel="stylesheet" href="../preview.css" />
</head>
<body>
  <main class="preview-page">
    <h1 class="preview-page__title">Checkbox 多选框</h1>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型一：仅选框</h2>
        <p class="preview-section__description">多选框可单独使用，不带文案。选中色可选黑色或橙色。</p>
      </header>
      <div class="preview-panel preview-panel--normal">
      <div class="preview-tiles">
        <div class="preview-tile">
          <span class="preview-tile__label">未选</span>
          <label class="pl-checkbox"><input class="pl-checkbox__control" type="checkbox" /></label>
        </div>
        <div class="preview-tile">
          <span class="preview-tile__label">已选 · 黑色</span>
          <label class="pl-checkbox"><input class="pl-checkbox__control" type="checkbox" checked /></label>
        </div>
        <div class="preview-tile">
          <span class="preview-tile__label">已选 · 橙色</span>
          <label class="pl-checkbox pl-checkbox--brand"><input class="pl-checkbox__control" type="checkbox" checked /></label>
        </div>
      </div>
      </div>
    </section>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型二：带文案</h2>
        <p class="preview-section__description">多选框右侧带 14px 文案，间距 6px。</p>
      </header>
      <div class="preview-panel preview-panel--normal">
      <div class="preview-tiles">
        <div class="preview-tile">
          <span class="preview-tile__label">未选</span>
          <label class="pl-checkbox"><input class="pl-checkbox__control" type="checkbox" /><span class="pl-checkbox__label">文案</span></label>
        </div>
        <div class="preview-tile">
          <span class="preview-tile__label">已选 · 黑色</span>
          <label class="pl-checkbox"><input class="pl-checkbox__control" type="checkbox" checked /><span class="pl-checkbox__label">文案</span></label>
        </div>
        <div class="preview-tile">
          <span class="preview-tile__label">已选 · 橙色</span>
          <label class="pl-checkbox pl-checkbox--brand"><input class="pl-checkbox__control" type="checkbox" checked /><span class="pl-checkbox__label">文案</span></label>
        </div>
      </div>
      </div>
    </section>
  </main>
</body>
</html>
