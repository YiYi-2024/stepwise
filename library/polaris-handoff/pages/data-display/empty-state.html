<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Empty state 空状态</title>
  <link rel="stylesheet" href="../../polaris.css" />
  <link rel="stylesheet" href="../preview.css" />
</head>
<body>
  <main class="preview-page">
    <h1 class="preview-page__title">Empty state 空状态</h1>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">类型一：空状态</h2>
        <p class="preview-section__description">插画（可替换）+ 标题 + 说明 + 操作按钮。标题和按钮均可省略。</p>
      </header>
      <div class="preview-panel preview-panel--normal">
        <div class="preview-empty-row">
      <div class="pl-empty-state">
        <div class="pl-empty-state__content">
          <img class="pl-empty-state__illustration" src="../../assets/illustrations/project.png" alt="" />
          <div class="pl-empty-state__message">
            <p class="pl-empty-state__title">暂无新项目</p>
            <p class="pl-empty-state__description">创建项目，收纳围绕同一研究目标的会话。</p>
          </div>
        </div>
        <button class="pl-button pl-button--primary" type="button">
          <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
          创建新项目
        </button>
      </div>
      <div class="pl-empty-state">
        <div class="pl-empty-state__content">
          <img class="pl-empty-state__illustration" src="../../assets/illustrations/project.png" alt="" />
          <div class="pl-empty-state__message">
            <p class="pl-empty-state__title">暂无新项目</p>
            <p class="pl-empty-state__description">创建项目，收纳围绕同一研究目标的会话。</p>
          </div>
        </div>
      </div>
      <div class="pl-empty-state">
        <div class="pl-empty-state__content">
          <img class="pl-empty-state__illustration" src="../../assets/illustrations/project.png" alt="" />
          <div class="pl-empty-state__message">
            <p class="pl-empty-state__description">创建项目，收纳围绕同一研究目标的会话。</p>
          </div>
        </div>
        <button class="pl-button pl-button--primary" type="button">
          <span class="pl-button__icon pl-icon--mask" style="--icon-src: url(../../assets/icons/add-lg.svg)"></span>
          创建新项目
        </button>
      </div>
      <div class="pl-empty-state">
        <div class="pl-empty-state__content">
          <img class="pl-empty-state__illustration" src="../../assets/illustrations/project.png" alt="" />
          <div class="pl-empty-state__message">
            <p class="pl-empty-state__description">创建项目，收纳围绕同一研究目标的会话。</p>
          </div>
        </div>
      </div>
        </div>
      </div>
    </section>

    <section class="preview-section">
      <header class="preview-section__header">
        <h2 class="preview-section__title">子组件：插画</h2>
        <p class="preview-section__description">显示尺寸 100×72，文件位于 assets/illustrations，按场景替换。</p>
      </header>
      <div class="preview-panel preview-panel--normal">
        <div class="preview-empty-gallery">
        <figure><img src="../../assets/illustrations/project.png" alt="" />项目 · project.png</figure>
        <figure><img src="../../assets/illustrations/session.png" alt="" />会话 · session.png</figure>
        <figure><img src="../../assets/illustrations/board.png" alt="" />看板 · board.png</figure>
        <figure><img src="../../assets/illustrations/library.png" alt="" />资料库 · library.png</figure>
        <figure><img src="../../assets/illustrations/skill.png" alt="" />技能 · skill.png</figure>
        <figure><img src="../../assets/illustrations/search.png" alt="" />搜索 · search.png</figure>
        <figure><img src="../../assets/illustrations/empty.png" alt="" />暂无 · empty.png</figure>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
