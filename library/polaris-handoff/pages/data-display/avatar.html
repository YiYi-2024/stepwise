<!DOCTYPE html>

<head>

  <title>Avatar 头像</title>
  <link rel="stylesheet" href="../../polaris.css" />

</head>
<body>
  <main class="preview-page">
    <h1 class="preview-page__title">Avatar 头像</h1>

    <section class="preview-section">

      <div class="preview-panel preview-panel--normal">
        <img class="pl-avatar" src="../../assets/avatar/Avatar.png" alt="头像" />

    </section>
  </main>

</html>
