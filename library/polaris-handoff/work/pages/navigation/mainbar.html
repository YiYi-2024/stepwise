</div></div></section>
</main>
<script>
const listAnimations = new WeakMap();

function toggleList(button, list) {
  const opening = button.getAttribute('aria-expanded') !== 'true';
  button.setAttribute('aria-expanded', String(opening));
  if (!list) return;

  const startHeight = list.getBoundingClientRect().height;
  listAnimations.get(list)?.cancel();
  list.inert = !opening;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    list.hidden = !opening;
    list.style.removeProperty('overflow');
    listAnimations.delete(list);
    return;
  }

  list.hidden = false;
  list.style.overflow = 'hidden';
  const animation = list.animate([
    { height: startHeight + 'px' },
    { height: (opening ? list.scrollHeight : 0) + 'px' }
  ], { duration: 160, easing: 'ease-in-out' });
  listAnimations.set(list, animation);
  animation.onfinish = () => {
    if (listAnimations.get(list) !== animation) return;
    list.hidden = !opening;
    list.style.removeProperty('overflow');
    listAnimations.delete(list);
  };
}

document.querySelectorAll('.pl-mainbar-item--project').forEach(button => {
  const list = button.closest('.pl-mainbar-group').querySelector('.pl-mainbar-group__children');
  if (list) button.addEventListener('click', () => toggleList(button, list));
});

document.querySelectorAll('.pl-mainbar-section__toggle').forEach(button => {
  button.addEventListener('click', () => {
    button.closest('.pl-mainbar-section').classList.remove('is-hover');
    toggleList(button, document.getElementById(button.getAttribute('aria-controls')));
  });
});

document.querySelectorAll('.pl-mainbar-group__more').forEach(button => {
  button.addEventListener('click', () => {
    button.closest('.pl-mainbar-group').querySelectorAll('[data-extra]').forEach(item => item.hidden = false);
    button.remove();
  });
});
</script>
<script>
document.querySelectorAll('.pl-icon-button--on-bg, .pl-mainbar-item__action--new-task').forEach(button => {
  const tip = button.querySelector('[role="tooltip"]');
  if (!tip || !tip.showPopover) return;
  tip.popover = 'manual';

  function positionTip() {
    const rect = button.getBoundingClientRect();
    tip.style.left = (rect.left + rect.width / 2) + 'px';
    tip.style.top = (rect.top - 6) + 'px';
  }

  function updateTip() {
    if (button.matches(':hover, :focus-visible')) {
      positionTip();
      tip.showPopover();
    } else {
      tip.hidePopover();
    }
  }

  for (const event of ['pointerenter', 'pointerleave', 'focus', 'blur']) {
    button.addEventListener(event, updateTip);
  }
  function repositionOpenTip() {
    if (tip.matches(':popover-open')) positionTip();
  }
  window.addEventListener('scroll', repositionOpenTip, true);
  window.addEventListener('resize', repositionOpenTip);
});
</script>
