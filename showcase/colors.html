<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>北极星 · Colors</title>
    <link rel="stylesheet" href="../src/css/colors.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans SC", "PingFang SC", "Segoe UI", sans-serif;
        line-height: 1.5;
        background: var(--polar-bg-main);
        color: var(--polar-text-primary);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(243, 107, 36, 0.12), transparent 40%),
          radial-gradient(circle at bottom right, rgba(57, 173, 55, 0.08), transparent 35%),
          var(--polar-bg-main);
      }

      main {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: 48px 0 80px;
      }

      header {
        margin-bottom: 40px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--polar-text-brand);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--polar-text-accent);
        font-size: clamp(32px, 5vw, 48px);
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .lede {
        margin: 0;
        max-width: 42rem;
        color: var(--polar-text-secondary);
        font-size: 16px;
      }

      section {
        margin-top: 40px;
      }

      section h2 {
        margin: 0 0 8px;
        color: var(--polar-text-accent);
        font-size: 24px;
        font-weight: 600;
      }

      section p {
        margin: 0 0 20px;
        color: var(--polar-text-secondary);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }

      .swatch {
        overflow: hidden;
        border: 1px solid var(--polar-border-primary);
        border-radius: 16px;
        background: var(--polar-bg-white);
      }

      .chip {
        height: 96px;
        border-bottom: 1px solid var(--polar-border-primary);
      }

      .meta {
        padding: 12px 14px;
      }

      .meta strong {
        display: block;
        color: var(--polar-text-primary);
        font-size: 14px;
        font-weight: 600;
      }

      .meta span {
        color: var(--polar-text-tertiary);
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .alias {
        display: block;
        margin-top: 4px;
        color: var(--polar-text-subtle);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">北极星设计规范</p>
        <h1>Colors</h1>
        <p class="lede">
          独立存储的颜色规范：Primitive 原始色 + Semantic 语义色。语义层通过 alias
          指向原始色，与 Figma Token 页保持一致。
        </p>
      </header>

      <section>
        <h2>Primitives</h2>
        <p>基础黑白、中性色阶、品牌橙、错误红、成功绿与遮罩 Alpha。</p>
        <div class="grid" id="primitives"></div>
      </section>

      <section>
        <h2>Semantic</h2>
        <p>面向 UI 的语义命名，优先在产品中使用这些 token。</p>
        <div class="grid" id="semantic"></div>
      </section>
    </main>

    <script type="module">
      import {
        primitiveByFigmaName,
        semanticAliases,
        semanticByFigmaName,
      } from "../src/colors/index.js";

      function paint(targetId, entries, withAlias = false) {
        const root = document.getElementById(targetId);
        root.innerHTML = entries
          .map(([name, hex]) => {
            const display =
              name === "Alpha/500" || name === "Mask/Primary"
                ? "rgba(56, 56, 56, 0.2)"
                : hex;
            const alias = withAlias
              ? `<span class="alias">→ ${semanticAliases[name] ?? ""}</span>`
              : "";
            return `
              <article class="swatch">
                <div class="chip" style="background:${display}"></div>
                <div class="meta">
                  <strong>${name}</strong>
                  <span>${hex}</span>
                  ${alias}
                </div>
              </article>
            `;
          })
          .join("");
      }

      paint("primitives", Object.entries(primitiveByFigmaName));
      paint("semantic", Object.entries(semanticByFigmaName), true);
    </script>
  </body>
</html>
